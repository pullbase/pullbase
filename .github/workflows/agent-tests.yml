name: Agent Tests

on:
  push:
    branches:
      - main
    paths:
      - 'agent/**' 
      - '.github/workflows/agent-tests.yml' 
  pull_request:
    branches:
      - main
    paths:
      - 'agent/**'
      - '.github/workflows/agent-tests.yml'

jobs:
  test:
    runs-on: buildjet-4vcpu-ubuntu-2204
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download Go modules
        working-directory: ./agent
        run: go mod download

      - name: Run agent tests
        working-directory: ./agent
        run: go test -v -parallel 4 -race ./... 