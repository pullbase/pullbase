<!doctype html>
<html lang="en" style="--font-geist-sans:'Geist Sans',sans-serif;--font-geist-mono:'Geist Mono',monospace;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PullBase - GitOps for Servers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;700&family=Geist+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('pullbase-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (err) {
          console.warn('Theme detection failed', err);
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
